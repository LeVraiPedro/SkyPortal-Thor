name: Apply V6 LED API4 CI correction

on:
  push:
    branches:
      - agent/v6-led-api4
    paths:
      - .github/workflows/apply-v6-led-api4-ci-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v6-led-api4-ci-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/v6-led-api4
          fetch-depth: 0

      - name: Verify and apply focused correction
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            'fdaf221ace2fe651aa05345912ed73d0b5967f834368cf34c0570e59f0de2bba' \
            '.github/v6-led-api4-ci-fix.patch' \
            | sha256sum --check
          git apply --check .github/v6-led-api4-ci-fix.patch
          git apply .github/v6-led-api4-ci-fix.patch
          rm .github/v6-led-api4-ci-fix.patch
          git diff --check

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix API4 LED polling compilation'
          git push origin HEAD:agent/v6-led-api4
