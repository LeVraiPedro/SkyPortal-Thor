name: Build signed V6 layout-fix SkyPortal

on:
  push:
    branches:
      - agent/v6-animated-portal-layout-fix
    paths:
      - .github/workflows/build-v6-layout-fix-skyportal.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate licensing and repository contents
        run: python3 tools/check_licensing.py

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >-
            platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
        with:
          cache-provider: basic

      - name: Prepare persistent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SKYPORTAL_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.SKYPORTAL_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.SKYPORTAL_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.SKYPORTAL_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64}"
          test -n "${SECRET_STORE_PASSWORD}"
          test -n "${SECRET_KEY_ALIAS}"
          test -n "${SECRET_KEY_PASSWORD}"
          umask 077
          keystore="${RUNNER_TEMP}/skyportal-release.jks"
          signing_file="${RUNNER_TEMP}/skyportal-signing.env"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          echo "::add-mask::${SECRET_STORE_PASSWORD}"
          echo "::add-mask::${SECRET_KEY_PASSWORD}"
          printf 'SKYPORTAL_STORE_FILE=%q\n' "${keystore}" > "${signing_file}"
          printf 'SKYPORTAL_STORE_PASSWORD=%q\n' "${SECRET_STORE_PASSWORD}" >> "${signing_file}"
          printf 'SKYPORTAL_KEY_ALIAS=%q\n' "${SECRET_KEY_ALIAS}" >> "${signing_file}"
          printf 'SKYPORTAL_KEY_PASSWORD=%q\n' "${SECRET_KEY_PASSWORD}" >> "${signing_file}"
          chmod 600 "${keystore}" "${signing_file}"

      - name: Test and build signed SkyPortal release
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
          set -a
          source "${RUNNER_TEMP}/skyportal-signing.env"
          set +a
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify certificate and prepare validation artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "${apk}"
          cp "${apk}" dist/SkyPortal_Thor_API4_LayoutFix.apk
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose dist/SkyPortal_Thor_API4_LayoutFix.apk
          cert="$("${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs dist/SkyPortal_Thor_API4_LayoutFix.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "${cert}"
          test "${cert}" = "502ae2f53a97b32a142cb11bda410a62dee5ee80af5b2d8fca2b70e05ed3229e"
          sha256sum dist/SkyPortal_Thor_API4_LayoutFix.apk > dist/SHA256SUMS.txt
          cat > dist/SKYPORTAL_LAYOUT_BUILD_INFO.txt <<EOF
          SkyPortal commit: ${GITHUB_SHA}
          Branch: agent/v6-animated-portal-layout-fix
          API compatibility: Dolphin SkyPortal API 4
          Certificate SHA-256: ${cert}
          Signing mode: PERSISTENT_RELEASE_KEY
          Purpose: AYN Thor lower-display animated Portal of Power layout validation
          EOF

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/skyportal-release.jks" "${RUNNER_TEMP}/skyportal-signing.env"

      - name: Upload signed companion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: SkyPortal-Thor-layout-fix-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
