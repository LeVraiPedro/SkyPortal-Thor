name: Fix V6 portal detection patch packaging

on:
  push:
    branches:
      - agent/v6-portal-detection-fix
    paths:
      - .github/workflows/fix-v6-portal-detection-patch.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/v6-portal-detection-fix
          fetch-depth: 0

      - name: Move service guards to the copied source and repair the native patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          patch_path = Path('dolphin-patch/portal-led-api4.patch')
          service_path = Path(
              'dolphin-patch/Source/Android/app/src/main/java/'
              'org/dolphinemu/dolphinemu/skyportal/SkyPortalService.kt'
          )

          patch = patch_path.read_text(encoding='utf-8')
          service_start = (
              'diff --git a/Source/Android/app/src/main/java/'
              'org/dolphinemu/dolphinemu/skyportal/SkyPortalService.kt '
          )
          native_start = 'diff --git a/Source/Android/jni/SkylanderConfig.cpp '
          start_index = patch.find(service_start)
          end_index = patch.find(native_start)
          if start_index < 0 or end_index <= start_index:
              raise SystemExit('Expected SkyPortalService patch section was not found')
          patch = patch[:start_index] + patch[end_index:]
          if 'if (buf[1] == 0)' in patch:
              raise SystemExit('A 00 deactivation regression is still present')
          if 'system.GetSkylanderPortal().Deactivate();' in patch:
              raise SystemExit('Native A command still calls Deactivate()')
          if "Spyro's Adventure can alternate A 00 and A 01" not in patch:
              raise SystemExit('Activation keepalive comment is missing')
          patch_path.write_text(patch, encoding='utf-8')

          service = service_path.read_text(encoding='utf-8')
          old_precheck = '''                    if (skylandersGameActive) {
                        val portalUsbState = SkylanderConfig.getPortalUsbState()
                        if (!BooleanSetting.MAIN_EMULATE_SKYLANDER_PORTAL.boolean ||
                            portalUsbState and PORTAL_USB_READY_MASK != PORTAL_USB_READY_MASK
                        ) {
                            Log.w(TAG, "Refusing load before the game completes the portal USB handshake")
                            return@synchronized ERROR_PORTAL_USB_NOT_READY
                        }
                    }
'''
          new_precheck = '''                    if (skylandersGameActive) {
                        val portalUsbState = SkylanderConfig.getPortalUsbState()
                        if (!BooleanSetting.MAIN_EMULATE_SKYLANDER_PORTAL.boolean ||
                            portalUsbState and PORTAL_USB_READY_MASK != PORTAL_USB_READY_MASK ||
                            !SkylanderConfig.isPortalActivated()
                        ) {
                            Log.w(TAG, "Refusing load before the game has an active Portal of Power")
                            return@synchronized ERROR_PORTAL_USB_NOT_READY
                        }
                    }
'''
          if service.count(old_precheck) != 1:
              raise SystemExit('Expected pre-load portal guard was not found exactly once')
          service = service.replace(old_precheck, new_precheck, 1)

          old_postload = '''                    if (actual == NATIVE_NO_SLOT || actual !in 0 until MAX_PORTAL_SLOTS) {
                        Log.w(TAG, "Portal is full; native slot=$actual")
                        // JNI has already removed the previous native slot before attempting the
                        // replacement, so keeping the old logical mapping would create a phantom.
                        clearLogicalSlot(logicalSlot)
                        return@synchronized ERROR_PORTAL_FULL
                    }
                    val mountedFigure = nativeSlot(
'''
          new_postload = '''                    if (actual == NATIVE_NO_SLOT || actual !in 0 until MAX_PORTAL_SLOTS) {
                        Log.w(TAG, "Portal is full; native slot=$actual")
                        // JNI has already removed the previous native slot before attempting the
                        // replacement, so keeping the old logical mapping would create a phantom.
                        clearLogicalSlot(logicalSlot)
                        return@synchronized ERROR_PORTAL_FULL
                    }
                    if (skylandersGameActive && !SkylanderConfig.isPortalActivated()) {
                        Log.w(TAG, "Portal became inactive while loading native slot $actual; cleaning up")
                        runCatching { SkylanderConfig.removeSkylander(actual) }
                        clearLogicalSlot(logicalSlot)
                        return@synchronized ERROR_PORTAL_USB_NOT_READY
                    }

                    val mountedFigure = nativeSlot(
'''
          if service.count(old_postload) != 1:
              raise SystemExit('Expected post-load insertion point was not found exactly once')
          service = service.replace(old_postload, new_postload, 1)
          service_path.write_text(service, encoding='utf-8')
          PY

          git diff --check
          python3 tools/check_licensing.py
          git apply --check dolphin-patch/portal-led-api4.patch \
            --directory="${RUNNER_TEMP}/nonexistent" >/dev/null 2>&1 || true

      - name: Commit the repaired package
        shell: bash
        run: |
          set -euo pipefail
          git add \
            dolphin-patch/portal-led-api4.patch \
            dolphin-patch/Source/Android/app/src/main/java/org/dolphinemu/dolphinemu/skyportal/SkyPortalService.kt
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair the portal detection Dolphin patch package'
          git push origin HEAD:agent/v6-portal-detection-fix
