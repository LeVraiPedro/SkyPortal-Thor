name: Export V6 LED API4 source

on:
  push:
    branches:
      - agent/v6-led-api4
    paths:
      - .github/workflows/export-v6-led-api4-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Create exact Git archive
        run: git archive --format=tar --output=v6-led-api4-source.tar HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v6-led-api4-source-${{ github.sha }}
          path: v6-led-api4-source.tar
          if-no-files-found: error
          retention-days: 1
