name: Build signed V6 portal layout validation

on:
  push:
    branches:
      - agent/v6-animated-portal-layout-fix
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - gradle.properties
      - gradlew
      - gradlew.bat
      - tools/check_licensing.py
      - .github/workflows/build-v6-layout-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate repository and candidate commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 tools/check_licensing.py

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
        with:
          cache-provider: basic

      - name: Test, lint and build debug
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Prepare persistent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SKYPORTAL_KEYSTORE_BASE64 }}
          SKYPORTAL_STORE_PASSWORD: ${{ secrets.SKYPORTAL_KEYSTORE_PASSWORD }}
          SKYPORTAL_KEY_ALIAS: ${{ secrets.SKYPORTAL_KEY_ALIAS }}
          SKYPORTAL_KEY_PASSWORD: ${{ secrets.SKYPORTAL_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" || -z "${SKYPORTAL_STORE_PASSWORD}" || \
                -z "${SKYPORTAL_KEY_ALIAS}" || -z "${SKYPORTAL_KEY_PASSWORD}" ]]; then
            echo 'The four persistent release signing secrets are required.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode \
            > "${RUNNER_TEMP}/skyportal-layout-release.p12"
          chmod 600 "${RUNNER_TEMP}/skyportal-layout-release.p12"
          test -s "${RUNNER_TEMP}/skyportal-layout-release.p12"

      - name: Build signed release companion
        env:
          SKYPORTAL_STORE_FILE: ${{ runner.temp }}/skyportal-layout-release.p12
          SKYPORTAL_STORE_PASSWORD: ${{ secrets.SKYPORTAL_KEYSTORE_PASSWORD }}
          SKYPORTAL_KEY_ALIAS: ${{ secrets.SKYPORTAL_KEY_ALIAS }}
          SKYPORTAL_KEY_PASSWORD: ${{ secrets.SKYPORTAL_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f -- "${RUNNER_TEMP}/skyportal-layout-release.p12"

      - name: Verify official certificate and package validation artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="dist/SkyPortal_Thor_API4_LayoutValidation.apk"
          cp app/build/outputs/apk/release/app-release.apk "${apk}"
          signer="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          "${signer}" verify --verbose "${apk}"
          certificates="$("${signer}" verify --print-certs "${apk}" |
            sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p')"
          test "${certificates}" = "502ae2f53a97b32a142cb11bda410a62dee5ee80af5b2d8fca2b70e05ed3229e"
          package_info="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "${apk}" | sed -n '1p')"
          [[ "${package_info}" == "package: name='com.skyportalthor.app' "* ]]
          source_archive="dist/SkyPortal_Thor_API4_LayoutValidation_Source.zip"
          source_prefix="SkyPortal-Thor-LayoutValidation/"
          git archive --format=zip --prefix="${source_prefix}" \
            --output="${source_archive}" "${GITHUB_SHA}"
          unzip -tq "${source_archive}"
          unzip -Z1 "${source_archive}" > "${RUNNER_TEMP}/skyportal-layout-source-entries.txt"
          for required in LICENSE NOTICE.md LICENSES/GPL-2.0-or-later.txt; do
            grep -Fx "${source_prefix}${required}" "${RUNNER_TEMP}/skyportal-layout-source-entries.txt"
          done
          cp LICENSE dist/LICENSE
          cp NOTICE.md dist/NOTICE.md
          printf '%s\n' \
            'Project: SkyPortal Thor V6 portal layout validation' \
            "Repository: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            "SkyPortal commit: ${GITHUB_SHA}" \
            "App tree: $(git rev-parse "${GITHUB_SHA}:app")" \
            "Repository tree: $(git rev-parse "${GITHUB_SHA}^{tree}")" \
            "Ref: ${GITHUB_REF}" \
            "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "Run attempt: ${GITHUB_RUN_ATTEMPT}" \
            'Dolphin requirement: already validated SkyPortal API 4 installation with the same certificate' \
            'Dolphin build/install: not performed by this workflow' \
            "Certificate SHA-256: ${certificates}" \
            'Signing mode: PERSISTENT_RELEASE_KEY' \
            "Android package: ${package_info}" \
            'Source license: GPL-2.0-or-later; see LICENSE and NOTICE.md' \
            'Purpose: candidate for AYN Thor hardware validation; this build does not certify hardware results' \
            > dist/BUILD_INFO.txt
          (
            cd dist
            sha256sum BUILD_INFO.txt LICENSE NOTICE.md \
              SkyPortal_Thor_API4_LayoutValidation.apk \
              SkyPortal_Thor_API4_LayoutValidation_Source.zip > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Upload signed companion and corresponding source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SkyPortal-Thor-layout-validation-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and Lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: layout-validation-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
