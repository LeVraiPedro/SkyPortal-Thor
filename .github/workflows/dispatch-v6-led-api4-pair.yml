name: Dispatch V6 LED API4 pair validation

on:
  push:
    branches:
      - agent/v6-led-api4
    paths:
      - .github/workflows/dispatch-v6-led-api4-pair.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for the temporary workflow to be removed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='agent/v6-led-api4'
          encoded_branch='agent%2Fv6-led-api4'
          for attempt in $(seq 1 60); do
            head_sha="$(curl --fail-with-body --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
            if [[ "${head_sha}" != "${GITHUB_SHA}" ]]; then
              printf 'Final clean branch head: %s\n' "${head_sha}"
              break
            fi
            sleep 2
          done
          test "${head_sha}" != "${GITHUB_SHA}"

      - name: Dispatch the full API4 pair build on the clean branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/full-pair-build.yml/dispatches" \
            --data '{"ref":"agent/v6-led-api4"}'
