name: Apply V6 portal final composition

on:
  push:
    branches:
      - agent/v6-animated-portal-layout-fix
    paths:
      - .github/workflows/apply-v6-portal-final-compose.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/v6-animated-portal-layout-fix
          fetch-depth: 0

      - name: Apply final panel composition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/skyportalthor/app/ui/portal/AnimatedPortal.kt')
          s = p.read_text(encoding='utf-8')

          old = 'import com.skyportalthor.app.portal.PortalState\n'
          new = 'import com.skyportalthor.app.data.GameFeature\nimport com.skyportalthor.app.portal.PortalState\n'
          if s.count(old) != 1:
              raise SystemExit('PortalState import marker mismatch')
          s = s.replace(old, new, 1)

          old = '    val visual = remember(portalState) { AnimatedPortalStateMapper.from(portalState) }\n    val toneColor = visual.tone.toColor()\n'
          new = '    val visual = remember(portalState) { AnimatedPortalStateMapper.from(portalState) }\n    val toneColor = visual.tone.toColor()\n    val showTrapZone = portalState.skylandersGame?.features?.contains(GameFeature.TRAPS) == true\n'
          if s.count(old) != 1:
              raise SystemExit('toneColor marker mismatch')
          s = s.replace(old, new, 1)

          old = '''            // Keep the portal itself full-size behind the status chrome. This preserves the
            // wide Portal of Power silhouette on the Thor's comparatively short lower panel.
            PortalCanvas(
                visual = visual,
                leftColor = leftColor,
                rightColor = rightColor,
                trapColor = trapColor,
                activation = activation,
                ambience = ambience,
                rotation = rotation,
                interactionBurst = interactionBurst.value,
                modifier = Modifier.fillMaxSize()
            )
'''
          new = '''            // Reserve the center exclusively for the portal drawing. The top status strip and
            // bottom RGB strip no longer overlap the Canvas on the Thor's short lower display.
            PortalCanvas(
                visual = visual,
                leftColor = leftColor,
                rightColor = rightColor,
                trapColor = trapColor,
                showTrapZone = showTrapZone,
                activation = activation,
                ambience = ambience,
                rotation = rotation,
                interactionBurst = interactionBurst.value,
                modifier = Modifier
                    .fillMaxSize()
                    .padding(top = 50.dp, bottom = 32.dp, start = 6.dp, end = 6.dp)
            )
'''
          if s.count(old) != 1:
              raise SystemExit('PortalCanvas call marker mismatch')
          s = s.replace(old, new, 1)

          old = '''                Column(modifier = Modifier.weight(1f)) {
                    Text(
                        "PORTAL EXPERIENCE • V6",
                        color = PortalPalette.Accent,
                        style = MaterialTheme.typography.labelSmall,
                        fontWeight = FontWeight.Black
                    )
                    Row(
                        horizontalArrangement = Arrangement.spacedBy(7.dp),
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        Box(
                            modifier = Modifier
                                .size(8.dp)
                                .background(toneColor, CircleShape)
                        )
                        Text(
                            visual.title,
                            color = Color.White,
                            style = MaterialTheme.typography.titleMedium,
                            fontWeight = FontWeight.Black,
                            maxLines = 1,
                            overflow = TextOverflow.Ellipsis
                        )
                    }
                    Text(
                        "${visual.detail} • ${if (playerTwoEnabled) "mode 2 joueurs" else "mode 1 joueur"}",
                        color = PortalPalette.Muted,
                        style = MaterialTheme.typography.bodySmall,
                        maxLines = 1,
                        overflow = TextOverflow.Ellipsis
                    )
                }
'''
          new = '''                Column(modifier = Modifier.weight(1f)) {
                    Text(
                        "PORTAL EXPERIENCE • V6",
                        color = PortalPalette.Accent,
                        style = MaterialTheme.typography.labelSmall,
                        fontWeight = FontWeight.Black
                    )
                    Row(
                        horizontalArrangement = Arrangement.spacedBy(7.dp),
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        Box(
                            modifier = Modifier
                                .size(8.dp)
                                .background(toneColor, CircleShape)
                        )
                        Text(
                            "${visual.title} • ${visual.detail}",
                            color = Color.White,
                            style = MaterialTheme.typography.bodyMedium,
                            fontWeight = FontWeight.Bold,
                            maxLines = 1,
                            overflow = TextOverflow.Ellipsis
                        )
                    }
                }
'''
          if s.count(old) != 1:
              raise SystemExit('Top status block marker mismatch')
          s = s.replace(old, new, 1)

          old = '''                Row(
                    modifier = Modifier.padding(horizontal = 8.dp, vertical = 5.dp),
                    horizontalArrangement = Arrangement.spacedBy(6.dp),
                    verticalAlignment = Alignment.CenterVertically
                ) {
                    PortalColorChip("G", visual.left, leftColor)
                    PortalColorChip("D", visual.right, rightColor)
                    visual.trap?.let { PortalColorChip("Trap", it, trapColor) }
'''
          new = '''                Row(
                    modifier = Modifier.padding(horizontal = 8.dp, vertical = 3.dp),
                    horizontalArrangement = Arrangement.spacedBy(6.dp),
                    verticalAlignment = Alignment.CenterVertically
                ) {
                    PortalColorChip("G", visual.left, leftColor)
                    PortalColorChip("D", visual.right, rightColor)
                    if (showTrapZone) {
                        visual.trap?.let { PortalColorChip("Trap", it, trapColor) }
                    }
'''
          if s.count(old) != 1:
              raise SystemExit('RGB row marker mismatch')
          s = s.replace(old, new, 1)

          old = '            modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp),\n'
          new = '            modifier = Modifier.padding(horizontal = 7.dp, vertical = 2.dp),\n'
          if s.count(old) != 1:
              raise SystemExit('Chip padding marker mismatch')
          s = s.replace(old, new, 1)

          old = '            Box(modifier = Modifier.size(8.dp).background(color, CircleShape))\n'
          new = '            Box(modifier = Modifier.size(7.dp).background(color, CircleShape))\n'
          if s.count(old) != 1:
              raise SystemExit('Chip dot marker mismatch')
          s = s.replace(old, new, 1)

          old = '''private fun PortalCanvas(
    visual: AnimatedPortalState,
    leftColor: Color,
    rightColor: Color,
    trapColor: Color,
    activation: Float,
'''
          new = '''private fun PortalCanvas(
    visual: AnimatedPortalState,
    leftColor: Color,
    rightColor: Color,
    trapColor: Color,
    showTrapZone: Boolean,
    activation: Float,
'''
          if s.count(old) != 1:
              raise SystemExit('PortalCanvas signature marker mismatch')
          s = s.replace(old, new, 1)

          replacements = [
              ('val portalWidth = min(canvasWidth * 0.76f, canvasHeight * 4.40f)',
               'val portalWidth = min(canvasWidth * 0.68f, canvasHeight * 6.20f)'),
              ('val portalHeight = portalWidth * 0.20f',
               'val portalHeight = portalWidth * 0.16f'),
              ('val baseHeight = (portalHeight * 0.42f).coerceAtLeast(17f)',
               'val baseHeight = (portalHeight * 0.32f).coerceAtLeast(10f)'),
              ('val baseTop = center.y + portalHeight * 0.36f',
               'val baseTop = center.y + portalHeight * 0.26f'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'Geometry marker mismatch: {old}')
              s = s.replace(old, new, 1)

          old = '''        visual.trap?.let {
            val trapCenter = Offset(
'''
          new = '''        if (showTrapZone) {
            visual.trap?.let {
                val trapCenter = Offset(
'''
          if s.count(old) != 1:
              raise SystemExit('Trap drawing marker mismatch')
          s = s.replace(old, new, 1)

          old = '''            drawPath(
                path = trapPath,
                color = Color.White.copy(alpha = 0.64f * activation),
                style = Stroke(width = (trapSize * 0.10f).coerceAtLeast(1f))
            )
        }
    }
}
'''
          new = '''                drawPath(
                    path = trapPath,
                    color = Color.White.copy(alpha = 0.64f * activation),
                    style = Stroke(width = (trapSize * 0.10f).coerceAtLeast(1f))
                )
            }
        }
    }
}
'''
          if s.count(old) != 1:
              raise SystemExit('Trap drawing closing marker mismatch')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          python3 tools/check_licensing.py

      - name: Commit product correction
        shell: bash
        run: |
          set -euo pipefail
          git add app/src/main/java/com/skyportalthor/app/ui/portal/AnimatedPortal.kt
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize portal panel composition on Thor'
          git push origin HEAD:agent/v6-animated-portal-layout-fix
