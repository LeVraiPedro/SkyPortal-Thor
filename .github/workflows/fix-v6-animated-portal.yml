name: Fix V6 animated portal compile issue

on:
  push:
    branches:
      - agent/v6-animated-portal
    paths:
      - .github/workflows/fix-v6-animated-portal.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/v6-animated-portal
          fetch-depth: 0

      - name: Remove invalid weight import and commit
        shell: bash
        run: |
          set -euo pipefail
          file='app/src/main/java/com/skyportalthor/app/ui/portal/AnimatedPortal.kt'
          grep -F 'import androidx.compose.foundation.layout.weight' "${file}"
          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "${file}"
          git diff --check
          python3 tools/check_licensing.py
          git add "${file}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix animated portal Compose weight resolution'
          git push origin HEAD:agent/v6-animated-portal
